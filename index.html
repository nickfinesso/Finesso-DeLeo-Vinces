<!DOCTYPE html> 
<HTML> 
<HEAD> 
<TITLE>Minigioco - Partenza da Sinistra</TITLE> 
<style type="text/css"> 
/* ... (CSS omesso per brevità, definisce l'aspetto visivo) ... */
</style> 
</HEAD> 
<BODY onLoad="inizia()"> <!-- Avvia il gioco appena la pagina è caricata -->
 <nav id="navbar"> 
    <div class="titolo">MINIGIOCO</div> 
    <button class="btn-pausa" onclick="togglePausa()">Pausa</button> 
    <button class="toggle-nav" onclick="document.getElementById('navbar').classList.toggle('hidden')">Nascondi/Mostra</button> 
 </nav> 
 <div id="campo"> 
    <DIV id='B' class='miediv'></DIV> <!-- Il nostro giocatore (quadratino) -->
 </div> 

<SCRIPT Language='JavaScript'> 
 var fermo = false; // Stato del gioco: se true, tutto si blocca
 var posX, posY; // Coordinate attuali del giocatore
 var velocitaAuto = 4; // Pixel di cui si sposta a destra ogni 30ms
 var spintaFrecce = 25; // Pixel di spostamento quando premi un tasto
 var intervalGioco; 

 function inizia() { 
    var b = document.getElementById('B'); 
    resetPosizione(); // Mette il giocatore al punto di partenza
    creaOstacoli(15); // Genera i 15 blocchi rossi casuali
    
    // Cambia il colore del giocatore ogni 500 millisecondi
    setInterval(function () { 
        if (!fermo) { 
            var colori = ['orange', 'yellow', 'green'];
            var x = Math.floor(Math.random() * 3); 
            b.style.backgroundColor = colori[x]; 
        } 
    }, 500); 

    // Gestione dei tasti: modifica le coordinate in base alla freccia premuta
    window.addEventListener('keydown', function(e) { 
        if (fermo) return; 
        if (e.code === 'ArrowRight') posX += spintaFrecce; 
        if (e.code === 'ArrowLeft') posX -= spintaFrecce; 
        if (e.code === 'ArrowUp') posY -= spintaFrecce; 
        if (e.code === 'ArrowDown') posY += spintaFrecce; 
    }); 

    // Avvia il loop principale: la funzione 'aggiorna' viene chiamata ogni 30ms
    intervalGioco = setInterval(aggiorna, 30); 
 } 

 function resetPosizione() { 
    posX = 10; // Torna vicino al bordo sinistro
    posY = window.innerHeight / 2; // Torna a metà altezza
 } 

 function creaOstacoli(n) { 
    var campo = document.getElementById('campo'); 
    for (var i = 0; i < n; i++) { 
        var o = document.createElement('div'); 
        o.className = 'miediv ostacolo'; 
        // Posizionamento casuale evitando i primi 100px a sinistra (zona partenza)
        o.style.left = (Math.random() * (window.innerWidth - 150) + 100) + "px"; 
        o.style.top = (Math.random() * (window.innerHeight - 100)) + "px"; 
        campo.appendChild(o); 
    } 
 } 

 function aggiorna() { 
    if (fermo) return; // Se in pausa o dopo scontro, non muovere nulla
    var b = document.getElementById('B'); 
    
    posX += velocitaAuto; // Incrementa costantemente la X (movimento a destra)

    // Logica "Teletrasporto": se esci a destra, riparti da sinistra
    if (posX > window.innerWidth) posX = -35; 
    
    // Limiti per non far uscire il giocatore sopra o sotto la navbar/schermo
    if (posY < 50) posY = 50; 
    if (posY > window.innerHeight - 40) posY = window.innerHeight - 40; 

    // Applica fisicamente le nuove coordinate X e Y all'elemento HTML
    b.style.left = posX + "px"; 
    b.style.top = posY + "px"; 
    
    controllaScontro(); // Ad ogni movimento controlla se hai toccato un ostacolo
 } 

 function controllaScontro() { 
    var b = document.getElementById('B'); 
    var ostacoli = document.getElementsByClassName('ostacolo'); 
    for (var i = 0; i < ostacoli.length; i++) { 
        var o = ostacoli[i]; 
        var ox = parseInt(o.style.left); 
        var oy = parseInt(o.style.top); 

        // Formula matematica per capire se i due quadrati si sovrappongono
        if (posX < ox + 75 && posX + 35 > ox && posY < oy + 75 && posY + 35 > oy) { 
            fermo = true; // Ferma il gioco
            b.style.backgroundColor = 'red'; // Feedback visivo della sconfitta
            setTimeout(function() { 
                resetPosizione(); // Dopo 1.5 secondi resetta tutto
                fermo = false; 
            }, 1500); 
            break; 
        } 
    } 
 } 

 function togglePausa() { 
    fermo = !fermo; // Inverte lo stato (se era true diventa false e viceversa)
    document.querySelector('.btn-pausa').innerText = fermo ? "Riprendi" : "Pausa"; 
 } 
</SCRIPT> 
</BODY> 
</HTML>
